services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      RATE_LIMIT_SALT: ${RATE_LIMIT_SALT:?RATE_LIMIT_SALT is required}
      TTS_PROVIDERS: ${TTS_PROVIDERS:-azure,kokoro}
      KOKORO_BASE_URL: ${KOKORO_BASE_URL:-}
      MEDIA_DIR: /data/media
    expose:
      - "3000"
    volumes:
      - media:/data/media
    networks:
      - dokploy-network

volumes:
  media:

networks:
  dokploy-network:
    external: true
