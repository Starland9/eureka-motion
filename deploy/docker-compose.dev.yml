name: eureka-dev

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eureka
      POSTGRES_USER: eureka
      POSTGRES_PASSWORD: eureka
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      # PostgreSQL 18 keeps its data in a versioned subdirectory of this path.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eureka -d eureka"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8880:8880"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

  pocket:
    profiles:
      - pocket
    build:
      context: ../workers/voice-pocket
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8890:8890"
    environment:
      POCKET_VOICES: ${POCKET_VOICE_FR:-estelle}:fr,${POCKET_VOICE_EN:-alba}:en
    volumes:
      - pocket-weights:/data/hf
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8890/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 4
      # The first start downloads about 220 MB of weights per language.
      start_period: 300s

  manim:
    build:
      context: ../workers/manim
    restart: unless-stopped
    init: true
    network_mode: none
    ipc: none
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256
    ulimits:
      core: 0
    tmpfs:
      - /tmp:size=1g,mode=1777,noexec,nosuid,nodev
    volumes:
      # A bind mount rather than the named volume of production: the development worker runs
      # on the host with SANDBOX_DIR=./sandbox.
      - ../sandbox:/data/sandbox
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-I"
        - "-c"
        - "import os, sys, time; beat = open(os.environ['SANDBOX_DIR'] + '/out/.heartbeat').read(); sys.exit(0 if time.time() - int(beat) < 60 else 1)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

volumes:
  db-data:
  pocket-weights:
