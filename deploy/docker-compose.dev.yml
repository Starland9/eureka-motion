name: eureka-dev

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eureka
      POSTGRES_USER: eureka
      POSTGRES_PASSWORD: eureka
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      # PostgreSQL 18 keeps its data in a versioned subdirectory of this path.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eureka -d eureka"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8880:8880"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

  manim:
    build:
      context: ../workers/manim
    restart: unless-stopped
    network_mode: none
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    tmpfs:
      - /tmp:size=1g,mode=1777
    volumes:
      - ../sandbox:/sandbox
    healthcheck:
      test: ["CMD-SHELL", "find /sandbox/out/.heartbeat -mmin -1 | grep -q ."]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

volumes:
  db-data:
